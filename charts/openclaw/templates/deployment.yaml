apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{include "openclaw.fullname" .}}
  labels:
    {{- include "openclaw.labels" . | nindent 4}}
spec:
{{- if not .Values.autoscaling.enabled}}
  replicas: {{.Values.replicaCount}}
{{- end}}
  selector:
    matchLabels:
      {{- include "openclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openclaw.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openclaw.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ include "openclaw.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http-api
          containerPort: 18789
          protocol: TCP
        - name: http-control-plane
          containerPort: 18790
          protocol: TCP
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- if or .Values.env .Values.secrets .Values.existingSecret }}
        env:
        {{- with .Values.env }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if or .Values.secrets .Values.existingSecret }}
        {{- range $key, $value := .Values.secrets }}
        - name: {{ $key | upper | replace "-" "_" }}
          valueFrom:
            secretKeyRef:
              name: {{ include "openclaw.secretName" $ }}
              key: {{ $key }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
