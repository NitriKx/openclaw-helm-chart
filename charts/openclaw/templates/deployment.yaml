apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{include "openclaw.fullname" .}}
  labels:
    {{- include "openclaw.labels" . | nindent 4}}
spec:
{{- if not .Values.autoscaling.enabled}}
  replicas: {{.Values.replicaCount}}
{{- end}}
  selector:
    matchLabels:
      {{- include "openclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and (not .Values.gatewayToken.existingSecret.name) .Values.gatewayToken.value }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openclaw.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openclaw.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ include "openclaw.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http-api
          containerPort: 18789
          protocol: TCP
        - name: http-control
          containerPort: 18790
          protocol: TCP
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- if or .Values.env .Values.gatewayToken.value .Values.gatewayToken.existingSecret.name .Values.extraSecrets }}
        env:
        {{- with .Values.env }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if or .Values.gatewayToken.value .Values.gatewayToken.existingSecret.name }}
        - name: CLAWDBOT_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.gatewayToken.existingSecret.name | default (include "openclaw.fullname" .) }}
              key: {{ .Values.gatewayToken.existingSecret.key }}
        {{- end }}
        {{- range .Values.extraSecrets }}
        - name: {{ .name }}
          valueFrom:
            secretKeyRef:
              name: {{ .secretName }}
              key: {{ .key }}
        {{- end }}
        {{- end }}
        {{- if .Values.volumeMounts }}
        volumeMounts:
        {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- else }}
        volumeMounts:
        {{- end }}
        - name: config
          mountPath: /home/node/.moltbot
        - name: workspace
          mountPath: /home/node/clawd
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        {{- if .Values.persistence.config.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.config.existingClaim | default (printf "%s-config" (include "openclaw.fullname" .)) }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: workspace
        {{- if .Values.persistence.workspace.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.workspace.existingClaim | default (printf "%s-workspace" (include "openclaw.fullname" .)) }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: tmp
        emptyDir: {}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
