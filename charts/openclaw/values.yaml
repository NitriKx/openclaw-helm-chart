# Default values for openclaw.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # Docker registry (leave empty for Docker Hub)
  registry: ""
  repository: alpine/openclaw
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  apiPort: 80
  controlPlanePort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http-api
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http-api
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables configuration
env: []
# - name: LOG_LEVEL
#   value: "info"
# - name: API_KEY
#   valueFrom:
#     secretKeyRef:
#       name: moltbot-secret
#       key: api-key

# Gateway token configuration
# Option 1: Use an existing secret (recommended for production)
gatewayToken:
  existingSecret:
    name: ""
    key: "gateway-token"
  # Option 2: Provide the value directly (not recommended for production)
  value: ""

# Additional secrets to mount as environment variables
extraSecrets: []
# - name: DATABASE_URL
#   secretName: database-credentials
#   key: connection-string
# - name: API_KEY
#   secretName: external-api-secret
#   key: api-key

# Persistence configuration
persistence:
  config:
    enabled: false
    # Use an existing PVC
    existingClaim: ""
    # Create a new PVC (only if existingClaim is not set)
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  workspace:
    enabled: false
    # Use an existing PVC
    existingClaim: ""
    # Create a new PVC (only if existingClaim is not set)
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi

# Extra manifests to deploy as part of the chart
# This allows you to deploy additional Kubernetes resources
extraManifests: []
# - apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: extra-config
#     namespace: default
#   data:
#     extra.config: |
#       some: value
# - apiVersion: v1
#   kind: Secret
#   metadata:
#     name: extra-secret
#   type: Opaque
#   stringData:
#     password: changeme

# ConfigMap data
configMap:
  enabled: false
  data: {}
  # config.yaml: |
  #   key: value
